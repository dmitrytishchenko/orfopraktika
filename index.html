const QUESTIONS=TOPICS.flatMap(t=>t.items.map(([n,text,explanation,reason])=>{
  const seg=text.match(/\[([^\]]*)\]/)[1],full=text.replace(/\[([^\]]*)\]/,'$1');
  const answer=t.choice?(seg.endsWith(' ')?t.choice[0]:t.choice[1]):seg;
  const r=Number.isInteger(reason)?reason:t.reasonMap?.[seg];
  return {id:`${t.id}_${n}`,topic:t.id,text,seg,answer,explanation,full,reason:t.reasons&&Number.isInteger(r)?r:null,single:!/\s/.test(full)};
}));
// Словари без прототипа: ключи вроде «constructor» или «toString» в них не найдутся.
const dict=entries=>Object.assign(Object.create(null),Object.fromEntries(entries));
const QM=dict(QUESTIONS.map(q=>[q.id,q]));
const TM=dict(TOPICS.map(t=>[t.id,t]));
const isKnown=id=>typeof id==='string'&&Object.hasOwn(QM,id);
if(Object.keys(QM).length!==QUESTIONS.length)console.error('ОрфоПрактика: в банке заданий повторяются номера');

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Свой диалог вместо confirm(): confirm() молча возвращает false в iframe без allow-modals.
function ask(text,buttons){
  const dlg=document.getElementById('dialog');
  if(typeof dlg.showModal!=='function'){const p=buttons.find(b=>b.primary);return Promise.resolve(confirm(text)&&p?p.value:'')}
  document.getElementById('dialogText').textContent=text;
  document.getElementById('dialogButtons').innerHTML=buttons.map(b=>`<button value="${esc(b.value)}"${b.primary?' class="primary"':''}${b.focus?' autofocus':''}>${esc(b.label)}</button>`).join('');
  dlg.returnValue='';
  return new Promise(resolve=>{dlg.addEventListener('close',()=>resolve(dlg.returnValue),{once:true});dlg.showModal()});
}
const CANCEL={label:'Отмена',value:'',focus:true};
const confirmAsk=(text,label)=>ask(text,[CANCEL,{label,value:'ok',primary:true}]).then(v=>v==='ok');

   Внутри APK страница открывается во WebView, где нет голоса браузера и скачивания файлов.
   Приложение даёт объект OrfoAndroid: голос Android для диктанта и сохранение файлов. */
const android=window.OrfoAndroid||null;

/* ===================== Речь (мини-диктант) ===================== */
const webSpeech='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
const canSpeak=!!android||webSpeech;
const ruVoice=()=>webSpeech?speechSynthesis.getVoices().find(v=>/^ru/i.test(v.lang))||null:null;
function speak(text,rate=0.9,tries=0){
  if(android){
    // Голос Android включается не мгновенно: первые секунды после запуска подождём его.
    if(android.ttsStatus()==='loading'){if(tries<15)setTimeout(()=>speak(text,rate,tries+1),300);return}
    android.speak(text,rate);return;
  }
  if(!webSpeech)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=rate;
  const v=ruVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);
}
if(webSpeech)speechSynthesis.addEventListener?.('voiceschanged',()=>{if(page==='quiz'&&db.active?.kind==='dictation')updateVoiceNotice()});
function updateVoiceNotice(){
  const el=document.getElementById('voiceNotice');if(!el)return;
  const status=android?android.ttsStatus():'';
  const noRu=android?status==='missing'||status==='error':webSpeech&&speechSynthesis.getVoices().length>0&&!ruVoice();
  el.textContent=!canSpeak?'Этот браузер не умеет читать вслух. Откройте тренажёр в Chrome.':noRu?'Не найден русский голос. На Android: Настройки → Специальные возможности → Синтез речи → установите русский язык.':'';
  el.classList.toggle('hidden',!el.textContent);
  if(android&&status==='loading')setTimeout(updateVoiceNotice,500);
}

/* ===================== Данные ===================== */
const kindOf=s=>KINDS.has(s.kind)?s.kind:KIND_BY_MODE[s.mode]||'topic';

// Проверяет и приводит данные к текущей версии. Ничего не выбрасывает молча:
// ответы на задания, которых больше нет в банке, уходят в orphans и хранятся дальше,
// повреждённые записи считаются в bad, чтобы вызывающий код отложил исходник.
function normalize(d){
  if(!d||typeof d!=='object'||(d.version!==1&&d.version!==VERSION)||!Array.isArray(d.attempts)||!Array.isArray(d.sessions))throw Error('format');
  const orphansIn=Array.isArray(d.orphans)?d.orphans:[];
  if(d.attempts.length+orphansIn.length>100000||d.sessions.length>10000)throw Error('size');
  let bad=0;const attempts=[],orphans=[];
  for(const a of [...d.attempts,...orphansIn]){
    if(!a||typeof a!=='object'||!isText(a.qid)||!isText(a.sid)||!isText(a.input)||typeof a.correct!=='boolean'||typeof a.hinted!=='boolean'||typeof a.skipped!=='boolean'||!Number.isInteger(a.step)||a.step<0||a.step>=1000||!isDate(a.at)){bad++;continue}
    const clean={sid:a.sid,step:a.step,qid:a.qid,input:a.input,correct:a.correct,hinted:a.hinted,skipped:a.skipped,retry:a.retry===true,at:a.at};
    if(typeof a.why==='boolean')clean.why=a.why;
    (isKnown(clean.qid)?attempts:orphans).push(clean);
  }
  attempts.sort(byTime);orphans.sort(byTime);
  const sessions=[];
  for(const s of d.sessions){
    if(!s||typeof s!=='object'||!isText(s.id)||!isText(s.mode)||!isDate(s.at)||typeof s.complete!=='boolean'){bad++;continue}
    sessions.push({id:s.id,kind:kindOf(s),mode:s.mode,at:s.at,complete:s.complete});
  }
  let active=null;const x=d.active;
  if(x){
    const ok=typeof x==='object'&&isText(x.id)&&isText(x.mode)&&isDate(x.at)&&Array.isArray(x.ids)&&x.ids.length>0&&x.ids.length<=1000&&Number.isInteger(x.index)&&x.index>=0&&x.index<x.ids.length&&typeof x.hint==='boolean';
    const kind=ok?kindOf(x):'topic';
    const roundsOk=kind!=='finderror'||(Array.isArray(x.rounds)&&x.rounds.length===x.ids.length&&x.rounds.every((r,i)=>r&&Array.isArray(r.ids)&&r.ids.length>=2&&r.ids.length<=6&&r.ids.every(isKnown)&&r.wrong===x.ids[i]&&r.ids.includes(r.wrong)&&isText(r.shown,200)));
    if(!ok)bad++;
    else if(!x.ids.every(isKnown)||!roundsOk)sessions.push({id:x.id,kind,mode:x.mode,at:x.at,complete:false}); // задание пропало из банка: занятие закрываем, ответы остаются
    else{
      const base=Number.isInteger(x.base)&&x.base>=1&&x.base<=x.ids.length?x.base:x.ids.length;
      active={id:x.id,kind,mode:x.mode,ids:[...x.ids],base,index:x.index,at:x.at,hint:x.hint};
      if(kind==='finderror')active.rounds=x.rounds.map(r=>({ids:[...r.ids],wrong:r.wrong,shown:r.shown}));
    }
  }
  sessions.sort(byTime);
  const st=d.settings&&typeof d.settings==='object'?d.settings:{};
  const settings={why:typeof st.why==='boolean'?st.why:true,goal:GOALS.includes(st.goal)?st.goal:10};
  return {db:{version:VERSION,attempts,orphans,sessions,active,settings},bad,fromVersion:d.version};
}

function stash(raw,tag){try{localStorage.setItem(`${KEY}.${tag}`,raw);return true}catch{return false}}
const stamp=()=>new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');

function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch{storageOK=false;setBanner('storageWarning',MSG.unavailable);return}
  if(raw!==null){
    let result=null;
    try{result=normalize(JSON.parse(raw))}catch{}
    if(!result||result.bad){
      // Исходник откладываем до того, как основной ключ будет перезаписан.
      const kept=stash(raw,'broken-'+stamp());
      if(!kept){saveBlocked=true;recoveryRaw=raw}
      showRecovery(!kept?MSG.blocked:result?MSG.partial(result.bad):MSG.broken);
    }
    if(result){
      db=result.db;
      if(result.fromVersion===1){try{if(localStorage.getItem(KEY+'.v1-backup')===null)stash(raw,'v1-backup')}catch{}}
    }
  }
  save();
}

function save(){
  if(saveBlocked){storageOK=false;return false}
  try{
    localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;setBanner('storageWarning','');
    // На сайте просим браузер не удалять данные при нехватке места (для установленного приложения обычно разрешает).
    if(!persistAsked&&location.protocol.startsWith('http')&&navigator.storage?.persist){persistAsked=true;navigator.storage.persist().catch(()=>{})}
    return true;
  }catch{storageOK=false;setBanner('storageWarning',MSG.saveFailed);return false}
}

// Вторая вкладка: подхватываем её изменения, а не затираем их своей копией.
window.addEventListener('storage',e=>{
  if(e.key===PROFILES_KEY){
    const cur=profiles.current;loadProfiles();
    if(profiles.list.some(p=>p.id===cur)){profiles.current=cur;KEY=dataKey(cur);updateHeader();if(page==='data')renderData()}
    else{openProfile(profiles.list[0].id);go('home')}
    return;
  }
  if(e.key!==KEY||e.newValue===null||saveBlocked)return;
  let next;try{next=normalize(JSON.parse(e.newValue)).db}catch{return}
  db=next;toast('Результаты обновлены: тренажёр открыт ещё в одной вкладке.');
  if(page==='quiz'){
    const el=document.getElementById('answer'),v=el&&!el.disabled?el.value:'';
    renderQuiz();
    const n=document.getElementById('answer');if(v&&n&&!n.disabled)n.value=v;
  }else if(page!=='result')render();

function merge(cur,inc){
  const key=a=>a.sid+'#'+a.step,have=new Set([...cur.attempts,...cur.orphans].map(key));
  const sids=new Set(cur.sessions.map(s=>s.id));
  const sessions=[...cur.sessions,...inc.sessions.filter(s=>!sids.has(s.id))];
  let active=cur.active;
  if(inc.active&&!sessions.some(s=>s.id===inc.active.id)&&inc.active.id!==cur.active?.id){
    if(!active)active=inc.active;
    else sessions.push({id:inc.active.id,kind:inc.active.kind,mode:inc.active.mode,at:inc.active.at,complete:false});
  }
  return {version:VERSION,
    attempts:[...cur.attempts,...inc.attempts.filter(a=>!have.has(key(a)))].sort(byTime),
    orphans:[...cur.orphans,...inc.orphans.filter(a=>!have.has(key(a)))].sort(byTime),
    sessions:sessions.sort(byTime),active,settings:cur.settings};
}

function backupKeys(prefix=KEY){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(prefix+'.'))out.push(k)}}catch{}return out.sort()}
function backupLabel(k){
  const tag=k.slice(KEY.length+1);
  if(tag==='v1-backup')return 'Копия истории до обновления тренажёра';
  const m=tag.match(/^broken-(\d{4})-(\d\d)-(\d\d)/);
  return m?`Нечитаемые данные от ${m[3]}.${m[2]}.${m[1]}`:tag;
}

/* ===================== Интервальное повторение =====================
   Состояние каждого задания выводится из журнала попыток, поэтому отдельно его хранить не нужно.
   Верный самостоятельный ответ, когда задание «созрело», переводит его в следующую коробку;
   ошибка или «не знаю» возвращают в коробку 0. Подсказка и повтор в конце занятия не продвигают. */
function memory(){
  const st=new Map();
  for(const a of db.attempts){
    const t=Date.parse(a.at);let s=st.get(a.qid);
    if(!s){s={box:0,due:0,last:0};st.set(a.qid,s)}
    s.last=t;
    if(!a.correct){s.box=0;s.due=t}
    else if(!a.hinted&&!a.retry&&t>=s.due){s.box=Math.min(s.box+1,MAX_BOX);s.due=t+INTERVALS[s.box]*DAY}
  }
  return st;
}
function dueIds(st=memory(),now=Date.now()){
  return QUESTIONS.filter(q=>{const s=st.get(q.id);return s&&s.due<=now})
    .sort((a,b)=>{const x=st.get(a.id),y=st.get(b.id);return x.box-y.box||x.due-y.due}).map(q=>q.id);
}
function memoryByTopic(st=memory(),now=Date.now()){
  const out=Object.create(null);
  for(const t of TOPICS)out[t.id]={total:t.items.length,fresh:0,due:0,learned:0};
  for(const q of QUESTIONS){const s=st.get(q.id),o=out[q.topic];if(!s){o.fresh++;continue}if(s.due<=now)o.due++;if(s.box>=LEARNED_BOX)o.learned++}
  return out;
}
const topicIds=topic=>QUESTIONS.filter(q=>q.topic===topic).map(q=>q.id);
// Невиденные — первыми, затем те, что встречались давнее всего.
function freshFirst(ids,st){const last=id=>st.get(id)?.last??-1;return shuffle(ids).sort((a,b)=>last(a)-last(b))}
function topicQueue(topic,st){const due=new Set(dueIds(st).filter(id=>QM[id].topic===topic));return [...due,...freshFirst(topicIds(topic).filter(id=>!due.has(id)),st)]}
function roundRobin(queues,limit,picked=[]){
  const seen=new Set(picked);queues=queues.map(q=>q.filter(id=>!seen.has(id)));
  while(picked.length<limit&&queues.some(q=>q.length))for(const q of queues){if(picked.length>=limit)break;const id=q.shift();if(id&&!seen.has(id)){seen.add(id);picked.push(id)}}
  return picked;
}
function topicsByNeed(){return shuffle(TOPICS).map(t=>({id:t.id,s:summary(t.id)})).sort((a,b)=>RANK[a.s.status]-RANK[b.s.status]||(a.s.p??101)-(b.s.p??101)).map(x=>x.id)}
// Сначала то, что пора повторить (до 70% занятия), затем по одному заданию из самых слабых тем.
function poolPick(filter,limit){
  const st=memory(),due=dueIds(st).filter(id=>filter(QM[id])).slice(0,Math.ceil(limit*0.7));
  return roundRobin(topicsByNeed().map(t=>freshFirst(topicIds(t).filter(id=>filter(QM[id])),st)),limit,due);
}
const forDictation=q=>q.single&&!TM[q.topic].choice&&!DICTATION_SKIP.has(q.id);
const forFind=q=>q.full.length<=30;
function wrongVariant(q){
  const t=TM[q.topic];
  if(t.choice)return q.text.replace(/\[([^\]]*)\]/,(_,seg)=>seg.endsWith(' ')?seg.trim():seg+' ');
  const segs=[...new Set(QUESTIONS.filter(x=>x.topic===q.topic).map(x=>x.seg))].filter(x=>x!==q.seg);
  const same=segs.filter(x=>x.length===q.seg.length),wrong=pick(same.length?same:segs);
  return q.text.replace(/\[[^\]]*\]/,()=>wrong);
}
function makeRound(target){
  const q=QM[target],others=[],used=new Set([q.topic]);
  for(const x of shuffle(QUESTIONS)){if(others.length===3)break;if(used.has(x.topic)||!forFind(x))continue;used.add(x.topic);others.push(x.id)}
  return {ids:shuffle([target,...others]),wrong:target,shown:wrongVariant(q)};
}
const plan={
  topic:t=>shuffle(topicQueue(t,memory()).slice(0,SIZE.topic)),
  diagnostic:()=>{const st=memory();return shuffle(TOPICS.flatMap(t=>freshFirst(topicIds(t.id),st).slice(0,SIZE.diagnostic)))},
  mixed:()=>shuffle(poolPick(()=>true,SIZE.session)),
  review:()=>shuffle(dueIds().slice(0,SIZE.session)),
  focus:topics=>{const st=memory();return shuffle(roundRobin(topics.map(t=>topicQueue(t,st)),SIZE.session))},
  dictation:()=>shuffle(poolPick(forDictation,SIZE.dictation)),
  finderror:()=>shuffle(poolPick(forFind,SIZE.finderror))
};
const startTopic=t=>start('topic',TM[t].name,plan.topic(t));
const startDiagnostic=()=>start('diagnostic','Диагностика',plan.diagnostic());
const startMixed=()=>start('mixed','Смешанная тренировка',plan.mixed());
const startReview=()=>start('review','Повторение на сегодня',plan.review());
const startFocus=topics=>start('focus','Работа над трудными темами',plan.focus(topics));
const startDictation=()=>{if(!canSpeak){toast('Этот браузер не умеет читать вслух. Откройте тренажёр в Chrome.');return}start('dictation','Мини-диктант',plan.dictation())};
const startFind=()=>start('finderror','Найди ошибку',plan.finderror());

/* ===================== Статистика ===================== */
// Самостоятельные ответы: без подсказки и не повтор в конце занятия. «Не знаю» — ошибка.
function scored(topic){return db.attempts.filter(a=>!a.hinted&&!a.retry&&(!topic||QM[a.qid].topic===topic))}
function summary(topic){const a=scored(topic),r=a.slice(-20),unique=new Set(r.map(x=>x.qid)).size,p=pct(r);return{all:a.length,n:r.length,unique,p,status:r.length<8||unique<6?'Мало данных':p>=85?'Получается уверенно':p>=65?'Нужно закрепить':'Стоит повторить'}}
function diagnosticResult(sid){
  const res=Object.create(null);
  for(const a of db.attempts){if(a.sid!==sid||a.retry)continue;const r=(res[QM[a.qid].topic]??={ok:0,total:0});r.total++;if(a.correct&&!a.hinted)r.ok++}
  return res;
}
function lastDiagnostic(){for(let i=db.sessions.length-1;i>=0;i--)if(db.sessions[i].kind==='diagnostic')return diagnosticResult(db.sessions[i].id);return null}
function todayCount(){const k=dayKey(Date.now());return db.attempts.filter(a=>!a.retry&&dayKey(a.at)===k).length}
function streak(){
  const goal=db.settings.goal,m=new Map();
  for(const a of db.attempts){if(a.retry)continue;const k=dayKey(a.at);m.set(k,(m.get(k)||0)+1)}
  const d=new Date();if((m.get(dayKey(d))||0)<goal)d.setDate(d.getDate()-1);
  let n=0;while((m.get(dayKey(d))||0)>=goal){n++;d.setDate(d.getDate()-1)}
  return n;
}
const whyStats=list=>{const w=list.filter(a=>typeof a.why==='boolean');return {n:w.length,ok:w.filter(a=>a.why).length}};

function render(){updateNav();({quiz:renderQuiz,stats:renderStats,rules:renderRules,data:renderData}[page]||renderHome)()}

document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});

/* ===================== Главная ===================== */

еты уже сохранены.</span><button id="resume" class="primary">Продолжить занятие</button></div>':''}<div class="row between section"><h2>Выбери тему</h2><span class="muted small">${TOPICS.length} ${plural(TOPICS.length,['тема','темы','тем'])} · ${QUESTIONS.length} ${plural(QUESTIONS.length,['задание','задания','заданий'])}</span></div>${GROUPS.map(g=>`<h3 class="group">${esc(g)}</h3><div class="grid">${TOPICS.filter(t=>t.group===g).map(card).join('')}</div>`).join('')}`;

/* ===================== Занятие ===================== */
function closeSession(complete){const s=db.active;if(!s)return null;db.sessions.push({id:s.id,kind:s.kind,mode:s.mode,at:s.at,complete});db.active=null;save();return s.id}
async function start(kind,mode,ids){
  if(!ids.length){toast('Пока нечего повторять — выбери тему или смешанную тренировку.');return}
  if(db.active){
    if(!await confirmAsk('Начать новое занятие? Текущее будет завершено досрочно. Все ответы останутся в статистике.','Начать новое'))return;
    closeSession(false);
  }
  db.active={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),kind,mode,ids,base:ids.length,index:0,at:new Date().toISOString(),hint:false};
  if(kind==='finderror')db.active.rounds=ids.map(makeRound);
  save();go('quiz');
}
function currentAttempt(){const s=db.active;return s?db.attempts.find(a=>a.sid===s.id&&a.step===s.index):null}
// «Почему так пишется?» — после верного самостоятельного ответа в обычной тренировке.
const asksWhy=(s,q,a)=>!!(a&&a.correct&&!a.hinted&&db.settings.why&&q.reason!==null&&!['diagnostic','dictation','finderror'].includes(s.kind));
const roundText=(r,id)=>id===r.wrong?r.shown.replace(/\[|\]/g,''):QM[id].full;
const keysHtml=()=>`<div class="row keys" role="group" aria-label="Буквы, которые трудно набрать">${['ё','ъ','ь'].map(k=>`<button type="button" data-key="${k}" aria-label="Вставить букву ${k}">${k}</button>`).join('')}</div>`;

function renderQuiz(){
  const s=db.active;if(!s){go('home');return}
  const q=QM[s.ids[s.index]],t=TM[q.topic],a=currentAttempt(),isRetry=s.index>=s.base,off=a?'disabled':'';
  const mode=s.kind==='dictation'?'dictation':s.kind==='finderror'?'finderror':t.choice?'choice':'gap';
  const canHint=!['diagnostic','dictation','finderror'].includes(s.kind);
  const round=s.rounds?.[s.index];
  const why=asksWhy(s,q,a),whyDone=typeof a?.why==='boolean';
  const filled=()=>esc(q.text).replace(/\[([^\]]*)\]/,(_,seg)=>t.choice?`<span class="gap">${esc(seg.trim())}</span>${seg.endsWith(' ')?' ':''}`:`<span class="gap">${esc(seg||'∅')}</span>`);
  let title,intro,body;
  if(mode==='gap'){
    title=isRetry?'Попробуй ещё раз':'Вставь пропущенное';
    intro='Введи букву или окончание. Если ничего вставлять не нужно, нажми «Без буквы». Буквы е и ё различаются.';
    body=`<div class="word">${a?filled():esc(q.text).replace(/\[[^\]]*\]/,'<span class="gap">…</span>')}</div><form id="answerForm" novalidate><div class="row answer-row"><label for="answer" class="sr-only">Твой ответ: буква или окончание</label><input id="answer" class="answer" type="text" lang="ru" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="12" placeholder="Ответ" ${off} value="${a?esc(a.input):''}"><button type="button" id="empty" ${off}>Без буквы</button></div>${a?'':keysHtml()}<div class="row answer-row"><button class="primary" type="submit" ${off}>Проверить</button>${canHint?`<button type="button" id="hint" ${off}>Вспомнить правило</button>`:''}<button type="button" id="skip" ${off}>Не знаю</button></div><div id="inputError" class="small bad status" role="alert"></div></form>`;
  }else if(mode==='choice'){
    title=isRetry?'Попробуй ещё раз':'Как пишется не с глаголом?';
    intro='Выбери, как пишется не с этим глаголом.';
    body=`<div class="word">${a?filled():esc(q.text).replace(/\[[^\]]*\]/,'<span class="gap">(не)</span>')}</div><div class="row answer-row">${t.choice.map(o=>`<button type="button" data-opt="${esc(o)}" class="${a&&a.input===o?'primary':''}" ${off}>${esc(o)}</button>`).join('')}</div><div class="row answer-row">${canHint?`<button type="button" id="hint" ${off}>Вспомнить правило</button>`:''}<button type="button" id="skip" ${off}>Не знаю</button></div>`;
  }else if(mode==='dictation'){
    title=isRetry?'Послушай ещё раз и запиши':'Послушай и запиши';
    intro='Нажми «Прослушать» и напиши услышанное полностью. Букву ё можно заменить на е.';
    body=`${a?`<div class="word">${filled()}</div>`:`<div class="row answer-row spaced"><button type="button" class="primary" id="say">Прослушать</button><button type="button" id="slow">Медленнее</button></div><p id="voiceNotice" class="notice warning hidden"></p>`}<form id="answerForm" novalidate><div class="row answer-row"><label for="answer" class="sr-only">Напиши услышанное слово</label><input id="answer" class="answer wide" type="text" lang="ru" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" placeholder="Напиши слово" ${off} value="${a?esc(a.input):''}"></div>${a?'':keysHtml()}<div class="row answer-row"><button class="primary" type="submit" ${off}>Проверить</button><button type="button" id="skip" ${off}>Не знаю</button></div><div id="inputError" class="small bad status" role="alert"></div></form>`;
  }else{
    title=isRetry?'Ещё раз: где ошибка?':'В каком слове ошибка?';
    intro='Одно из слов написано с ошибкой. Нажми на него.';
    body=`<div class="picks">${round.ids.map(id=>{const wrong=id===round.wrong,picked=a&&(a.input===roundText(round,id));return `<button type="button" data-pick="${esc(id)}" class="${a&&wrong?'is-wrong':''} ${picked?'picked':''}" ${off}>${a&&wrong?`<s>${esc(roundText(round,id))}</s> → ${esc(q.full)}`:esc(roundText(round,id))}</button>`}).join('')}</div><div class="row answer-row"><button type="button" id="skip" ${off}>Не знаю</button></div>`;
  }
  let feedback='';
  if(a){
    const nearYo=mode==='gap'&&!a.correct&&!a.skipped&&q.answer.includes('ё')&&cleanAnswer(a.input).replace(/ё/g,'е')===q.answer.replace(/ё/g,'е');
    const verdict=a.skipped?'Пока не знаю — разберём вместе':a.correct?'Верно!':mode==='gap'?`Верный ответ: ${esc(q.answer||'без буквы')}`:mode==='choice'?`Правильно: ${esc(q.answer)}`:mode==='dictation'?`Правильно: ${esc(q.full)}`:`«${esc(a.input)}» написано верно. Ошибка в другом слове.`;
    feedback=`<div class="notice ${a.correct?'':'error'}"><strong>${verdict}</strong>${mode==='dictation'&&!a.correct&&!a.skipped?`<p class="small">Ты написал(а): ${esc(a.input)}</p>`:''}${nearYo?'<p>Почти! Здесь нужна именно буква ё — она есть на кнопке под полем ответа.</p>':''}${mode==='finderror'?`<p>${esc(TM[q.topic].name)}: ${esc(q.full)}.</p>`:''}<p>${esc(q.explanation)}</p>${mode==='gap'||mode==='choice'?`<p class="small">${esc(q.full)}</p>`:''}${a.hinted?'<p class="small">С подсказкой — в отдельной статистике.</p>':''}${!a.correct&&s.kind!=='diagnostic'&&!isRetry?'<p class="small">Это задание вернётся в конце занятия.</p>':''}</div>`;
  }
  const whyHtml=why?(whyDone?`<p class="notice ${a.why?'':'warning'}">${a.why?'Правило выбрано верно.':`Здесь работает другое правило: ${esc(t.reasons[q.reason])}.`}</p>`:`<div class="why"><h3>Почему так пишется?</h3><div class="choices">${t.reasons.map((r,i)=>`<button type="button" data-why="${i}">${esc(r)}</button>`).join('')}</div></div>`):'';
  const showNext=a&&(!why||whyDone);
  const eyebrow=mode==='dictation'&&!a?'Мини-диктант':mode==='finderror'&&!a?'Найди ошибку':esc(t.name);
  app.innerHTML=`<section class="quiz"><div class="row between"><span class="row"><span class="pill">${esc(s.mode)}</span>${isRetry?'<span class="pill warn">Повтор ошибки</span>':''}</span><span class="small muted">${s.index+1} / ${s.ids.length}</span></div><div class="bar"><span style="width:${100*(s.index+(a?1:0))/s.ids.length}%"></span></div><div class="card"><div class="eyebrow">${eyebrow}</div><h2 class="spaced">${title}</h2><p class="muted small">${intro}</p>${body}${s.hint&&!a?`<div class="notice rule">${esc(t.rule)}<p class="small muted">Ответ с подсказкой сохранится отдельно и не повысит показатель самостоятельных ответов.</p></div>`:''}${feedback}${whyHtml}${showNext?`<button class="primary" id="next">${s.index===s.ids.length-1?'Посмотреть итог':'Следующее задание →'}</button>`:''}</div><div class="row between spaced"><button id="pause">Пауза · на главную</button><button id="finish">Завершить сейчас</button></div></section>`;

  const input=document.getElementById('answer');
  const form=document.getElementById('answerForm');
  if(form)form.onsubmit=e=>{e.preventDefault();mode==='dictation'?submitDictation(false):submitGap(false)};

  app.querySelectorAll('[data-key]').forEach(b=>{
    b.onpointerdown=e=>e.preventDefault(); // не уводим фокус из поля: на телефоне клавиатура не закроется
    b.onclick=()=>{const from=input.selectionStart??input.value.length,to=input.selectionEnd??from;input.setRangeText(b.dataset.key,from,to,'end');input.focus()};
  });
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>submitChoice(b.dataset.opt));
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>submitFind(b.dataset.pick));
  app.querySelectorAll('[data-why]').forEach(b=>b.onclick=()=>{a.why=Number(b.dataset.why)===q.reason;save();renderQuiz();announce(a.why?'Правило выбрано верно.':`Здесь работает другое правило: ${t.reasons[q.reason]}.`)});
  document.getElementById('hint')?.addEventListener('click',()=>{const v=input?.value;s.hint=true;save();renderQuiz();if(v)document.getElementById('answer').value=v});
  document.getElementById('skip').onclick=()=>({gap:submitGap,choice:()=>submitChoice(null),dictation:submitDictation,finderror:()=>submitFind(null)}[mode])(true);
  document.getElementById('say')?.addEventListener('click',()=>{speak(q.full);input.focus()});
  document.getElementById('slow')?.addEventListener('click',()=>{speak(q.full,0.6);input.focus()});
  document.getElementById('pause').onclick=()=>go('home');
  document.getElementById('finish').onclick=async()=>{if(await confirmAsk('Завершить занятие сейчас? Все сделанные ответы сохранятся.','Завершить'))showResult(closeSession(false))};
  document.getElementById('next')?.addEventListener('click',()=>{if(s.index===s.ids.length-1)showResult(closeSession(true));else{s.index++;s.hint=false;save();renderQuiz()}});
  if(mode==='dictation'&&!a){
    updateVoiceNotice();
    const k=s.id+':'+s.index;if(lastSpoken!==k){lastSpoken=k;setTimeout(()=>speak(q.full),300)}
  }
  (document.getElementById('next')||document.querySelector('[data-why]')||(!a&&input)||document.querySelector('[data-opt],[data-pick]'))?.focus();
}

function record(q,{input,correct,skipped},message){
  const s=db.active,retry=s.index>=s.base;
  db.attempts.push({sid:s.id,step:s.index,qid:q.id,input,correct,hinted:s.hint,skipped,retry,at:new Date().toISOString()});
  if(!correct&&!retry&&s.kind!=='diagnostic'){s.ids.push(q.id);if(s.rounds)s.rounds.push(makeRound(q.id))} // ошибку повторим в конце занятия
  save();renderQuiz();
  announce((skipped?'Разберём вместе. ':correct?'Верно! ':message)+q.explanation);
}
function readInput(skipped,maxLen,fullWord){
  const err=document.getElementById('inputError');
  const raw=skipped?'':document.getElementById('answer').value.trim().toLowerCase().replace(/\s+/g,' ');
  if(skipped)return '';
  if(!raw){err.textContent=fullWord?'Напиши услышанное слово.':'Введи ответ. Если буква не нужна, нажми «Без буквы».';return null}
  if(/[a-z]/.test(raw)){err.textContent='Похоже, включена английская раскладка — переключи клавиатуру на русский язык.';return null}
  if(!fullWord&&cleanAnswer(raw).length>maxLen){err.textContent='Введи только пропущенную букву или окончание, а не всё слово.';return null}
  return raw;
}
function submitGap(skipped){
  const s=db.active;if(!s||currentAttempt())return;
  const q=QM[s.ids[s.index]],raw=readInput(skipped,4,false);if(raw===null)return;
  const correct=!skipped&&cleanAnswer(raw)===q.answer;
  record(q,{input:raw,correct,skipped},`Неверно. Верный ответ: ${q.answer||'без буквы'}. `);
}
function submitChoice(opt){
  const s=db.active;if(!s||currentAttempt())return;
  const q=QM[s.ids[s.index]],skipped=opt===null;
  record(q,{input:opt||'',correct:!skipped&&opt===q.answer,skipped},`Неверно. Правильно: ${q.answer}. `);
}
function submitDictation(skipped){
  const s=db.active;if(!s||currentAttempt())return;
  const q=QM[s.ids[s.index]],raw=readInput(skipped,40,true);if(raw===null)return;
  record(q,{input:raw,correct:!skipped&&normWord(raw)===normWord(q.full),skipped},`Неверно. Правильно: ${q.full}. `);
}
function submitFind(id){
  const s=db.active;if(!s||currentAttempt())return;
  const r=s.rounds[s.index],q=QM[r.wrong],skipped=id===null;
  record(q,{input:skipped?'':roundText(r,id),correct:id===r.wrong,skipped},`Ошибка была здесь: ${roundText(r,r.wrong)}. Правильно: ${q.full}. `);
}

function showResult(id){

  }
  const goal=db.settings.goal,today=todayCount();
  app.innerHTML=`<section class="quiz"><div class="card"><div class="eyebrow">Занятие завершено</div><h1 class="spaced">${base.length?'Хорошая работа!':'Вернёмся к практике позже'}</h1><p>Верно: <strong>${base.filter(a=>a.correct).length} из ${base.length}</strong> ${plural(base.length,['задания','заданий','заданий'])}. С подсказкой: ${base.filter(a=>a.hinted).length}. «Не знаю»: ${base.filter(a=>a.skipped).length}.</p><p class="muted">Самостоятельно: ${ind.length?`${pct(ind)}% из ${ind.length}`:'пока нет ответов'}. «Не знаю» считается ошибкой, ответы с подсказкой сюда не входят.</p>${w.n?`<p>Почему так пишется: правило выбрано верно ${w.ok} из ${w.n}.</p>`:''}${retries.length?`<p>Повтор ошибок в конце занятия: исправлено ${retries.filter(a=>a.correct).length} из ${retries.length}.</p>`:''}<p class="small muted">${today>=goal?'Цель на сегодня выполнена!':`Цель на сегодня: ${today} из ${goal}.`}</p>${diagHtml}${wrong.length?`<h2 class="section">Что разобрать</h2>${wrong.map(a=>{const q=QM[a.qid];return `<details><summary>${esc(q.full)}${fixed.has(a.qid)?' <span class="small muted">· при повторе — верно</span>':''}</summary><p>${esc(q.explanation)}</p><p class="small muted">Твой ответ: ${esc(a.skipped?'не знаю':a.input||'—')}</p></details>`}).join('')}`:diagHtml?'':'<p>Можно перейти к другой теме или сделать перерыв.</p>'}<div class="row spaced"><button ${weakTopics.length?'':'class="primary"'} id="toStats">Посмотреть анализ</button><button id="toHome">На главную</button></div></div></section>`;

function activity(){const counts=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=d.toDateString();counts.push({label:d.toLocaleDateString('ru-RU',{day:'numeric',month:'numeric'}),n:db.attempts.filter(a=>new Date(a.at).toDateString()===key).length})}const max=Math.max(1,...counts.map(x=>x.n));return `<div class="chart">${counts.map(x=>`<div class="chart-col"><span>${x.n}</span><div class="chart-stick" style="height:${Math.round(100*x.n/max)}px"></div><span>${x.label}</span></div>`).join('')}</div>`}

function download(content,name,type){if(android){android.saveFile(name,type.split(';')[0],content);return}const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
const fileTag=()=>profiles.list.length>1?'-'+profileName().replace(/[\\/:*?"<>|\s]+/g,'_'):'';
const csv=rows=>'﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
function exportCSV(){
  const mem=memoryByTopic();
  const rows=[['Тема','Самостоятельных ответов всего','Верно за всё время, %','Последних ответов','Разных заданий среди последних','Верно среди последних, %','Выучено заданий','Всего заданий в теме','К повторению сегодня','С подсказкой всего','Не знаю всего','Вывод']];
  TOPICS.forEach(t=>{const s=summary(t.id),m=mem[t.id];rows.push([t.name,s.all,pct(scored(t.id))??'',s.n,s.unique,s.p??'',m.learned,m.total,m.due,db.attempts.filter(a=>QM[a.qid].topic===t.id&&a.hinted&&!a.retry).length,db.attempts.filter(a=>QM[a.qid].topic===t.id&&a.skipped&&!a.retry).length,s.status])});
  download(csv(rows),`ОрфоПрактика${fileTag()}-темы.csv`,'text/csv;charset=utf-8');
}
function exportErrorsCSV(){
  const st=memory(),now=Date.now(),by=new Map();
  for(const a of db.attempts){
    if(a.retry)continue;
    const r=by.get(a.qid)||{wrong:0,right:0,lastWrong:'',last:''};
    if(a.correct)r.right++;else{r.wrong++;r.lastWrong=a.skipped?'не знаю':a.input}
    r.last=a.at;by.set(a.qid,r);
  }
  const rows=[['Слово или предложение','Тема','Ошибок','Верных ответов','Последний неверный ответ','Последняя попытка','Сейчас']];
  [...by].filter(([,r])=>r.wrong).sort((x,y)=>y[1].wrong-x[1].wrong||x[1].right-y[1].right).forEach(([id,r])=>{
    const q=QM[id],m=st.get(id);
    rows.push([q.full,TM[q.topic].name,r.wrong,r.right,r.lastWrong,new Date(r.last).toLocaleDateString('ru-RU'),m.due<=now?'пора повторить':m.box>=LEARNED_BOX?'выучено':'в работе']);
  });
  download(csv(rows),`ОрфоПрактика${fileTag()}-ошибки.csv`,'text/csv;charset=utf-8');
}

  const appInfo=android?'<p>Тренажёр установлен как приложение для Android и работает без интернета. Резервные копии и отчёты сохраняются туда, куда вы выберете.</p>':standalone?'<p>Тренажёр открыт как приложение и работает без интернета.</p>':installPrompt?'<p>Тренажёр можно установить как приложение: он появится на главном экране и будет работать без интернета.</p><button class="primary" id="install">Установить приложение</button>':web?'<p class="small muted">На Android в Chrome: меню ⋮ → «Установить приложение» или «Добавить на главный экран». На iPhone в Safari: «Поделиться» → «На экран „Домой“».</p>':'<p class="small muted">Сейчас тренажёр открыт как файл. Чтобы установить его на телефон, выложите папку тренажёра на сайт (например, GitHub Pages — см. README) и откройте адрес в Chrome.</p>';
  const recovery=recoveryRaw||backups.length?`<h3 class="section">Отложенные данные</h3><p class="small muted">Сюда тренажёр откладывает историю, которую не смог прочитать, и копию истории перед обновлением. Скачайте их, если хотите сохранить на всякий случай.</p>${recoveryRaw?'<div class="notice warning"><span>Старые данные не удалось прочитать и не хватило места, чтобы их отложить. Пока они не скачаны, новые ответы не сохраняются.</span><div class="row"><button class="primary" id="rawDownload">Скачать старые данные</button><button id="rawDiscard">Начать заново без них</button></div></div>':''}${backups.map(k=>`<div class="row between backup"><span>${esc(backupLabel(k))} <span class="small muted">· ${size(k)}</span></span><span class="row"><button data-dl="${esc(k)}">Скачать</button><button data-del="${esc(k)}">Удалить</button></span></div>`).join('')}`:'';
  app.innerHTML=`<section class="quiz"><div class="eyebrow">Результаты остаются у вас</div><h1>Настройки</h1>
<div class="card"><h2>Ученики</h2><p class="small muted">У каждого ученика своя история, свои настройки и своё повторение.</p>${profiles.list.map(p=>`<div class="row between backup"><input class="text-input" data-rename="${esc(p.id)}" value="${esc(p.name)}" maxlength="40" aria-label="Имя ученика"><span class="row">${p.id===profiles.current?'<span class="pill">Сейчас занимается</span>':`<button data-switch="${esc(p.id)}">Выбрать</button>`}${profiles.list.length>1?`<button data-remove="${esc(p.id)}">Удалить</button>`:''}</span></div>`).join('')}<form id="addProfile" class="row backup"><input id="newName" class="text-input" maxlength="40" placeholder="Имя нового ученика" aria-label="Имя нового ученика"><button type="submit">Добавить ученика</button></form>
<h2 class="section">Занятия${profiles.list.length>1?' · '+esc(profileName()):''}</h2><label class="row"><input type="checkbox" id="setWhy" ${db.settings.why?'checked':''}> Спрашивать «Почему так пишется?» после верного ответа</label><label class="row spaced">Цель на день: <select id="setGoal">${GOALS.map(n=>`<option value="${n}" ${n===db.settings.goal?'selected':''}>${n} ${plural(n,['задание','задания','заданий'])}</option>`).join('')}</select></label>
<h2 class="section">Приложение на телефон</h2>${appInfo}</div>
<div class="card section"><h2>Сохранение данных</h2><p>Тренажёр хранит ответы на этом устройстве в браузере. Аккаунт не нужен, ответы никуда не отправляются.</p><p class="small muted">Используйте один и тот же браузер и открывайте тренажёр из того же места. У файла на компьютере и у сайта разные хранилища: чтобы перенести историю, скачайте копию в одном месте и загрузите в другом. В приватном режиме или после очистки данных браузера история может исчезнуть.</p><p><span class="pill ${storageOK?'':'warn'}">${storageOK?'Автосохранение работает':'Нужна резервная копия'}</span></p>${db.orphans.length?`<p class="small muted">Ответов на задания, которых больше нет в тренажёре: ${db.orphans.length}. Они хранятся в истории и в резервной копии, но в статистике не учитываются.</p>`:''}<h3 class="section">Резервная копия${profiles.list.length>1?' · '+esc(profileName()):''}</h3><p class="small muted">JSON сохраняет все ответы и незавершённое занятие. Скачивайте копию регулярно. Копию можно объединить с историей на другом устройстве или заменить ею историю.</p><div class="row"><button class="primary" id="backup">Скачать копию JSON</button><button id="import">Загрузить копию</button><input type="file" id="file" accept="application/json,.json" class="hidden"></div><p id="importStatus" role="status" class="small"></p>${recovery}<h3 class="section">Отчёты для родителя или учителя</h3><p class="small muted">Открываются в Excel: проценты и выводы по темам, а также список слов, в которых были ошибки.</p><div class="row"><button id="csv">Отчёт по темам CSV</button><button id="csvErrors">Список ошибок CSV</button></div><details class="spaced"><summary>Удаление статистики</summary><p class="small muted">Удалятся все ответы и текущая тренировка ученика «${esc(profileName())}» в этом браузере. Сначала сохраните резервную копию.</p><button id="reset">Удалить всю статистику</button></details></div></section>`;

  app.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>switchProfile(b.dataset.switch));
  app.querySelectorAll('[data-rename]').forEach(inp=>inp.onchange=()=>{const name=inp.value.trim().slice(0,40),p=profiles.list.find(x=>x.id===inp.dataset.rename);if(!p)return;if(!name){inp.value=p.name;return}p.name=name;saveProfiles();updateHeader();toast('Имя сохранено.')});
  app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{
    const p=profiles.list.find(x=>x.id===b.dataset.remove);if(!p)return;
    if(!await confirmAsk(`Удалить ученика «${p.name}» и всю его историю в этом браузере? Сначала можно скачать его резервную копию.`,'Удалить'))return;
    const key=dataKey(p.id);try{localStorage.removeItem(key);backupKeys(key).forEach(k=>localStorage.removeItem(k))}catch{}
    profiles.list=profiles.list.filter(x=>x.id!==p.id);
    if(p.id===profiles.current)openProfile(profiles.list[0].id);
    saveProfiles();updateHeader();renderData();
  });
  document.getElementById('addProfile').onsubmit=e=>{
    e.preventDefault();const name=document.getElementById('newName').value.trim().slice(0,40);if(!name)return;
    if(profiles.list.length>=30){toast('Можно добавить не больше 30 учеников.');return}
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    profiles.list.push({id,name});openProfile(id);saveProfiles();go('home');toast(`Ученик «${name}» добавлен.`);
  };
  document.getElementById('setWhy').onchange=e=>{db.settings.why=e.target.checked;save()};
  document.getElementById('setGoal').onchange=e=>{db.settings.goal=Number(e.target.value);save()};
  document.getElementById('install')?.addEventListener('click',async()=>{const p=installPrompt;if(!p)return;p.prompt();try{await p.userChoice}catch{}installPrompt=null;renderData()});
  document.getElementById('backup').onclick=()=>download(JSON.stringify(db,null,2),`ОрфоПрактика${fileTag()}-копия-${new Date().toISOString().slice(0,10)}.json`,'application/json');
  document.getElementById('csv').onclick=exportCSV;
  document.getElementById('csvErrors').onclick=exportErrorsCSV;
  document.getElementById('import').onclick=()=>document.getElementById('file').click();
  document.getElementById('file').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      if(f.size>30*1024*1024)throw Error('size');
      const r=normalize(JSON.parse(await f.text())),n=r.db.attempts.length+r.db.orphans.length;
      const choice=await ask(`В копии ${n} ${plural(n,['ответ','ответа','ответов'])}${r.bad?`, повреждённых записей: ${r.bad} — они будут пропущены`:''}. Объединить копию с историей ученика «${profileName()}» или заменить историю копией?`,[CANCEL,{label:'Заменить',value:'replace'},{label:'Объединить',value:'merge',primary:true}]);
      if(!choice)return;
      db=choice==='merge'?merge(db,r.db):r.db;save();renderData();
      document.getElementById('importStatus').textContent=choice==='merge'?'Копия объединена с текущей историей.':'Копия загружена. История заменена.';
    }catch{document.getElementById('importStatus').textContent='Не удалось прочитать копию. Выберите JSON-файл, скачанный из этого тренажёра. Текущая история не изменилась.'}
    finally{e.target.value=''}
  };
  document.getElementById('rawDownload')?.addEventListener('click',()=>{download(recoveryRaw,'ОрфоПрактика-старые-данные.json','application/json');saveBlocked=false;recoveryRaw=null;save();document.getElementById('recoveryNotice').classList.add('hidden');renderData();toast('Старые данные скачаны. Новые ответы снова сохраняются.')});
  document.getElementById('rawDiscard')?.addEventListener('click',async()=>{if(!await confirmAsk('Начать заново? Старые данные, которые не удалось прочитать, будут удалены.','Начать заново'))return;saveBlocked=false;recoveryRaw=null;save();document.getElementById('recoveryNotice').classList.add('hidden');renderData()});
  app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const k=b.dataset.dl;try{download(localStorage.getItem(k)||'','ОрфоПрактика-'+k.slice(KEY.length+1)+'.json','application/json')}catch{}});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!await confirmAsk('Удалить эти отложенные данные? Восстановить их будет нельзя.','Удалить'))return;try{localStorage.removeItem(b.dataset.del)}catch{}renderData()});
  document.getElementById('reset').onclick=async()=>{if(await confirmAsk(`Удалить всю статистику ученика «${profileName()}»? Это действие нельзя отменить без резервной копии.`,'Удалить всё')){const settings=db.settings;db=blank();db.settings=settings;save();renderData()}};
}

/* ===================== Запуск ===================== */
// Манифест, иконки и офлайн-режим подключаем только на сайте: у файла с диска их всё равно нет.
if(location.protocol.startsWith('http')){
  for(const [rel,href,sizes] of [['manifest','manifest.webmanifest'],['icon','icons/icon-192.png','192x192'],['apple-touch-icon','icons/apple-touch-icon.png']]){
    const l=document.createElement('link');l.rel=rel;l.href=href;if(sizes)l.sizes=sizes;document.head.append(l);
  }
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
// Кнопка «Назад» в Android-приложении: закрыть диалог, вернуться на главную, и только с главной — выйти.
window.orfoBack=()=>{
  const dlg=document.getElementById('dialog');
  if(dlg.open){dlg.close();return true}
  if(page!=='home'){go('home');return true}
  return false;
};
loadProfiles();
load();
updateHeader();
render();
</script>
</body>
</html>
